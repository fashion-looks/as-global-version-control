name: ASGV Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        type: choice
        options: [dev, staging, production]
        required: true
      image_tag:
        description: Previously successful 40-character Git SHA image tag
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Restore previous image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ inputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          ASGV_SECRET_BACKEND: ${{ vars.ASGV_SECRET_BACKEND }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TARGET: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[a-f0-9]{40}$ ]]
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_PORT" && test -n "$DEPLOY_KEY" && test -n "$GHCR_TOKEN"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ENV_TEXT="DATABASE_URL=$DATABASE_URL
          REDIS_URL=$REDIS_URL
          GITHUB_WEBHOOK_SECRET=$GITHUB_WEBHOOK_SECRET
          ASGV_SECRET_BACKEND=${ASGV_SECRET_BACKEND:-env}
          AWS_REGION=${AWS_REGION:-ap-south-1}
          ARTIFACT_DIR=/data/artifacts"
          ENV_B64="$(printf '%s' "$ENV_TEXT" | base64 -w0)"
          printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p ~/asgv/$TARGET"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "printf '%s' '$ENV_B64' | base64 -d > ~/asgv/$TARGET/.env && chmod 600 ~/asgv/$TARGET/.env"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker pull '$IMAGE:$TAG'"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker stop asgv-worker-$TARGET || true; docker rm asgv-worker-$TARGET || true; docker run -d --restart unless-stopped --name asgv-worker-$TARGET --env-file ~/asgv/$TARGET/.env -v asgv-$TARGET-data:/data --entrypoint rq '$IMAGE:$TAG' worker asgv-builds"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker stop asgv-$TARGET || true; docker rm asgv-$TARGET || true; docker run -d --restart unless-stopped --name asgv-$TARGET --env-file ~/asgv/$TARGET/.env -p '$DEPLOY_PORT':8000 -v asgv-$TARGET-data:/data '$IMAGE:$TAG'"
