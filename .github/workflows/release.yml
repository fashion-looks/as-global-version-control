name: ASGV Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint and test
        run: |
          ruff check .
          pytest -q
      - name: Release summary
        run: |
          echo "## ASGV release validation" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "Validation passed. Configure protected GitHub Environments for deployment." >> "$GITHUB_STEP_SUMMARY"
