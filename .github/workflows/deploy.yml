name: ASGV Build and Deploy Dev-Staging

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        type: choice
        options: [dev, staging]
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: asgv-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Image metadata
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build container
        run: docker build -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" .
      - name: Login and push GHCR image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
      - name: Create build report
        run: |
          mkdir -p reports
          printf '{"image":"%s","tag":"%s","commit":"%s","built_at":"%s"}\n'             "${{ steps.meta.outputs.image }}" "${{ steps.meta.outputs.tag }}" "${GITHUB_SHA}" "$(date -u +%FT%TZ)" > reports/build-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: asgv-build-report
          path: reports/
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref == 'refs/heads/main' && 'staging' || 'dev') }}
    steps:
      - name: Prepare SSH access
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy container
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          ASGV_SECRET_BACKEND: ${{ vars.ASGV_SECRET_BACKEND }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref == 'refs/heads/main' && 'staging' || 'dev') }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_PORT"
          ENV_TEXT="DATABASE_URL=$DATABASE_URL
          REDIS_URL=$REDIS_URL
          GITHUB_WEBHOOK_SECRET=$GITHUB_WEBHOOK_SECRET
          ASGV_SECRET_BACKEND=${ASGV_SECRET_BACKEND:-env}
          AWS_REGION=${AWS_REGION:-ap-south-1}
          ARTIFACT_DIR=/data/artifacts"
          ENV_B64="$(printf '%s' "$ENV_TEXT" | base64 -w0)"
          printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p ~/asgv/$TARGET"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "printf '%s' '$ENV_B64' | base64 -d > ~/asgv/$TARGET/.env && chmod 600 ~/asgv/$TARGET/.env"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker pull '$IMAGE:$TAG'"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker stop asgv-$TARGET || true; docker rm asgv-$TARGET || true; docker run -d --restart unless-stopped --name asgv-$TARGET --env-file ~/asgv/$TARGET/.env -p '$DEPLOY_PORT':8000 -v asgv-$TARGET-data:/data '$IMAGE:$TAG'"
